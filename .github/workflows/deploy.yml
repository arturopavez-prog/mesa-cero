name: Publicar MESA CERO en GitHub Pages

# GitHub Pages publica desde la rama gh-pages.
# Cada push a main copia el contenido a gh-pages y Pages se actualiza solo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copiar main a gh-pages
        run: git push --force origin HEAD:gh-pages
