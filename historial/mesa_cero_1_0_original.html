<style>

*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:radial-gradient(circle at 87% 4%,#183847 0,transparent 37%),var(--bg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);line-height:1.65}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:var(--cyan)}a:hover{color:white}::selection{background:#3a6e72}

.main{padding:30px clamp(22px,5.5vw,94px) 70px;max-width:1300px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:38px}.crumb{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.status{display:flex;gap:8px;align-items:center;font-size:12px;border-radius:99px;padding:7px 12px;background:#173b41;color:var(--cyan);border:1px solid #2e6161}.status .dot{height:7px;width:7px;background:var(--cyan);border-radius:50%}
h1,h2,h3{line-height:1.18;letter-spacing:-.025em}h1{font-size:clamp(36px,5vw,65px);margin:13px 0 18px}h2{font-size:clamp(27px,3.2vw,40px);margin:9px 0 16px}h3{font-size:21px;margin:14px 0}.lead{font-size:clamp(16px,1.55vw,19px);color:#c8d9db;max-width:760px}.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--orange);font-weight:750}.hero{padding:40px;background:linear-gradient(130deg,#143140,#0c212e 55%,#112c33);border:1px solid #2c5160;border-radius:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-92px;top:-80px;width:280px;height:280px;border:1px solid #ffffff15;border-radius:50%;box-shadow:0 0 0 34px #ffffff06,0 0 0 69px #ffffff06;pointer-events:none}.hero>*{position:relative;z-index:1}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:19px 0 24px}.chip{font-size:12px;color:#d0e1e5;background:#ffffff0c;border:1px solid #ffffff24;border-radius:100px;padding:6px 12px}.btn{display:inline-flex;justify-content:center;align-items:center;gap:9px;border:1px solid #456370;color:#e7f3f5;border-radius:11px;padding:12px 17px;background:#1b3544;font-weight:760;min-height:44px;transition:transform .12s,background .12s}.btn:hover:not(:disabled){transform:translateY(-1px);background:#264a59}.btn.primary{background:var(--orange);color:#132630;border-color:var(--orange)}.btn.primary:hover:not(:disabled){background:#ffca8d}.btn.ghost{background:transparent}.btn.danger{color:#ffc2c6;border-color:#68424a}.btn.smallbtn{font-size:12px;padding:8px 11px;min-height:36px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}.stat{padding:19px;border:1px solid #2b4653;border-radius:16px;background:#0f2632}.stat .number{font-size:32px;line-height:1.2;font-weight:850;color:var(--orange)}.stat .label{font-size:12px;color:#a9c4ce;line-height:1.5}.card{border:1px solid var(--stroke);background:linear-gradient(130deg,#112736,#10212e);padding:23px;border-radius:17px}.card + .card{margin-top:14px}.road{margin-top:26px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.road-item{background:#112633;border:1px solid #2b4756;border-radius:16px;padding:24px}.road-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.road-num{color:var(--orange);font-size:12px;letter-spacing:.14em}.road-title{font-size:21px;font-weight:800;margin:8px 0}.road-meta{color:#a5bfca;font-size:13px;margin-bottom:19px}.progress-track{height:7px;border-radius:99px;background:#28434e;overflow:hidden;margin:13px 0}.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--orange));border-radius:99px}.footnote{margin-top:27px;color:#91aeb7;font-size:12px}.module-header{border-bottom:1px solid #29424e;padding-bottom:26px;margin-bottom:24px}.step-row{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.step-indicator{color:var(--orange);font-size:13px;font-weight:800;letter-spacing:.12em}.step-timer{font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:9px;border:1px solid #3c5c65;padding:8px 14px;border-radius:100px;background:#152f3b;font-weight:800}.step-timer.urgent{color:var(--red);border-color:var(--red);background:#361c26}.step-timer .clock{font-size:18px}.scene{padding:22px 25px;background:#17303c;border-left:4px solid var(--orange);border-radius:0 14px 14px 0;margin:22px 0;color:#e1eef1}.scene .who{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--orange);font-weight:900;display:block;margin-bottom:7px}.scene p{margin:0 0 10px}.scene p:last-child{margin-bottom:0}.theory{margin:23px 0;padding:23px;background:#102632;border:1px solid #32505e;border-radius:15px}.theory h3{margin-top:0}.theory p{margin:9px 0}.theory ul{padding-left:22px}.theory li{margin:8px 0}.theory strong{color:#ffcf97}.warning{border:1px solid #5b5140;background:#302820;color:#f9dfb5;padding:14px 17px;border-radius:12px;font-size:13px;margin:18px 0}.tip{border:1px solid #2b5b59;background:#102e2e;color:#c8f6e9;padding:14px 17px;border-radius:12px;font-size:13px;margin:18px 0}.choices{display:grid;gap:11px;margin-top:22px}.choice{width:100%;text-align:left;display:grid;grid-template-columns:33px 1fr;gap:13px;align-items:center;background:#102734;border:1px solid #33515e;padding:17px;border-radius:13px;color:#e8f4f4;line-height:1.5}.choice:hover:not(:disabled){border-color:#7fadaf;background:#163441}.choice .letter{width:31px;height:31px;border:1px solid #56717c;display:grid;place-items:center;border-radius:9px;color:var(--orange);font-weight:800}.choice.chosen{border-color:var(--orange);background:#2a3134}.choice.feedback{cursor:default}.choice.best{border-color:var(--cyan)}.choice.bad{border-color:#bc6267}.feedback-panel{margin-top:20px;background:#123132;border:1px solid #31645c;padding:22px;border-radius:14px}.feedback-panel h3{margin:0 0 8px;color:var(--cyan)}.feedback-panel p{margin:7px 0}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:750;color:#cfe3e6;margin-bottom:7px}.field textarea,.field input,.field select{width:100%;background:#081c27;color:white;border:1px solid #3b5965;border-radius:11px;padding:13px;outline:none}.field textarea:focus,.field input:focus,.field select:focus{border-color:var(--orange)}textarea{min-height:95px;resize:vertical}.field .help{font-size:12px;color:#8eacb9;margin-top:5px}.num{font-variant-numeric:tabular-nums}.points{font-variant-numeric:tabular-nums;font-size:15px;color:var(--orange);font-weight:800}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:15px;background:#0e2430;border:1px solid #2f5060;border-radius:11px}.metric-label{font-size:12px;color:var(--muted)}.metric-value{font-size:25px;font-weight:850;font-variant-numeric:tabular-nums}.metric-value.good{color:var(--cyan)}.metric-value.bad{color:var(--red)}.table-wrap{overflow-x:auto}.payoff{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}.payoff th,.payoff td{border:1px solid #385465;padding:13px;min-width:130px;text-align:center}.payoff th{color:#ffcf96;background:#1a3441}.payoff td{background:#112a36}.mini{font-size:12px;color:var(--muted)}.pill{padding:4px 9px;background:#2d4c54;border-radius:99px;font-size:11px;white-space:nowrap}.pill.good{background:#1e554c;color:#beffee}.pill.warn{background:#62462e;color:#ffdf9e}.pill.red{background:#593038;color:#ffc1c7}.scenario{font-size:17px;line-height:1.8;color:#edf3f2}.hr{height:1px;background:#34505a;margin:22px 0}.game-choices{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0}.round{padding:10px;background:#1b3641;border:1px solid #375664;border-radius:10px;text-align:center;font-size:12px;min-height:75px}.round b{font-size:17px;color:var(--orange)}.result-list{display:grid;gap:9px}.result-row{display:flex;justify-content:space-between;gap:15px;padding:12px;border:1px solid #304a55;border-radius:9px;font-size:14px}.source-list{padding-left:20px}.source-list li{margin:9px 0}.report{margin-top:23px;background:#132a35;border:1px solid #34535e;border-radius:16px;padding:25px}.score-big{font-weight:900;font-size:54px;color:var(--orange);line-height:1}.sliders{margin:20px 0}.slider-line{display:flex;gap:15px;align-items:center;margin:14px 0}.slider-line label{width:145px;font-size:13px;color:var(--muted)}input[type="range"]{flex:1;accent-color:var(--orange)}.checkrow{display:flex;align-items:flex-start;gap:10px;padding:12px 0}.checkrow input{accent-color:var(--orange);margin-top:6px}.footer-nav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:28px}.deadline{font-size:12px;color:#bbd0d4;margin-top:7px}.explain{font-size:14px;color:#bcd2d7}.module-end{padding:27px;background:#132d39;border:1px solid #315568;border-radius:19px}.completion-icon{font-size:46px}.tag{display:inline-block;padding:4px 11px;border-radius:50px;background:#294552;color:var(--cyan);font-size:12px;font-weight:800}.big-title{font-size:27px;font-weight:850}.hidden{display:none!important}
@media(max-width:930px){.app{display:block}.side{height:auto;position:static;padding:13px 17px;border-bottom:1px solid var(--stroke);border-right:0}.logo{margin:0}.side-label,.side-footer,.nav-links{display:none}.main{padding:20px 17px 60px}.top{margin-bottom:20px}.hero{padding:28px}.road{grid-template-columns:1fr}}@media(max-width:560px){.two-col,.grid3{grid-template-columns:1fr}.hero{padding:23px}.choice{padding:14px}.rounds{gap:4px}.round{font-size:10px;padding:8px 3px}.slider-line{display:block}.slider-line label{display:block;width:auto}.slider-line input{width:100%}.card,.theory{padding:17px}}

<body>
<div class="app">
<aside class="side">
  <div class="logo"><div class="logo-mark">M0</div><div>MESA CERO<br><span class="small" style="font-size:9px">LABORATORIO PERSONAL</span></div></div>
  <div id="side-navig" class="nav-links"></div>
  <div class="side-footer"><strong>Regla de entrenamiento</strong><br>La presión se practica; la improvisación se paga. Cada decisión cuenta. Las respuestas abiertas se guardan, pero no se corrigen por inteligencia artificial.</div>
</aside>
<main class="main">
  <div class="top"><div class="crumb" id="breadcrumb">Entrenamiento / Inicio</div><div class="status"><span class="dot"></span> Edición privada · v1.0</div></div>
  <div id="content" aria-live="polite"></div>
</main>
</div>
<script>
'use strict';
// MESA CERO. Sin dependencia externa, sin captación de datos y sin evaluación semántica simulada.
const STORE='mesa_cero_arturo_v1';
const DEFAULT={version:1,created:Date.now(),cursor:null,records:{},drafts:{},deadlines:{},game:{rounds:[],deadline:null},settings:{},history:[]};
function load(){try{const o=JSON.parse(localStorage.getItem(STORE));if(o&&o.version===1)return {...structuredClone(DEFAULT),...o};}catch(e){}return structuredClone(DEFAULT)}
let S=load(),selected=null,clock=null;
const money=n=>'$'+Math.round(n).toLocaleString('es-CL');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(m,s)=>m+'-'+s;
const durationText=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
const fmtDate=t=>new Intl.DateTimeFormat('es-CL',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(t));
function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
const C=(question,context,options,why,seconds=90)=>({type:'choice',title:question,context,options,why,seconds,max:20});
const L=(title,html)=>({type:'lesson',title,html,max:0});
const O=(title,context,fields,seconds=300)=>({type:'open',title,context,fields,max:20,seconds});
const A=(title,context,fields)=>({type:'assignment',title,context,fields,max:20});
const modules=[
 {label:'Domina la presión',tag:'ESCUCHA · EMOCIÓN · LÍMITES',minutes:75,objective:'Calmar la mesa sin regalar condiciones comerciales.',steps:[
 L('La regla de oro: antes de resolver, comprender',`
 <p class="lead">Un ultimátum no es una orden: es información acerca de la posición y del estado emocional de la otra parte.</p>
 <div class="theory"><h3>Del modelo de crisis a la negociación comercial</h3><p>El <b>modelo de influencia conductual por etapas</b> se puede representar así:</p><ol><li><b>Escucha activa.</b> Hacer que la otra persona se sienta comprendida.</li><li><b>Empatía.</b> Comprender su perspectiva sin aprobar exigencias.</li><li><b>Rapport.</b> Establecer conexión y confianza.</li><li><b>Influencia.</b> Proponer opciones cuando exista disposición a explorarlas.</li><li><b>Cambio conductual.</b> Lograr una decisión constructiva.</li></ol><p>No es un botón mágico ni un guion rígido. En crisis reales, la seguridad de personas es prioritaria; aquí solo adaptamos habilidades de comunicación a conflictos comerciales.</p></div>
 <div class="scene"><span class="who">Caso de apertura · Comprador molesto</span>«Me tienen cansado. Si no me igualas el precio de la competencia, mañana te saco de todos mis proyectos».</div>
 <p>Tu impulso puede ser argumentar, defenderte o descontar. Tu tarea inicial es distinta: <b>identificar qué le preocupa, qué necesita proteger y qué información falta.</b></p>
 <div class="warning">Advertencia metodológica: escuchar no obliga a conceder; empatizar no equivale a estar de acuerdo; poner límites no equivale a atacar.</div>`),
 C('Primer contacto: ¿qué dices?',`Llevas tres meses proveyendo a una constructora. Su jefe de compras te llama furioso: «Quince por ciento de descuento ahora, o mañana trabajamos con otro».`,[
 {text:'«Eso es imposible. Nuestras tarifas son nuestras tarifas».',pts:4,why:'Proteges el precio, pero entras a una lucha de posiciones sin entender la urgencia.'},
 {text:'«Entiendo que estás bajo presión por el costo de esta obra. ¿Qué cambió para que esto sea urgente hoy?»',pts:20,why:'Reconoces la presión y abres información. No entregas margen.'},
 {text:'«Te doy 10%, pero me confirmas el pedido hoy».',pts:0,why:'Cedes antes de descubrir el problema y anclas tu concesión.'},
 {text:'«No puedo creer que me hables así. Trabajamos hace años».',pts:3,why:'Desplazas el foco a tu molestia, escalando el conflicto.'}
 ],'Primero estabiliza la conversación; después negocia términos.',90),
 L('Cuatro herramientas que debes dominar',`
 <div class="theory"><h3>1. Etiquetado emocional</h3><p>«Parece que te preocupa quedar expuesto ante la gerencia por los costos de la obra». Ponle nombre a la emoción como <i>hipótesis</i>, no como diagnóstico.</p></div>
 <div class="theory"><h3>2. Reflejo o mirroring</h3><p>Cliente: «Tu competidor es mucho más flexible». Tú: «¿Más flexible?» Y callas. Puede ampliar información, pero no sirve si se usa como muletilla mecánica.</p></div>
 <div class="theory"><h3>3. Preguntas abiertas y calibradas</h3><p>«¿Qué tendría que ocurrir para que esta operación fuera defendible ante finanzas?» invita a explicar condiciones. Evita «¿Por qué eres tan difícil?».</p></div>
 <div class="theory"><h3>4. Límites con reciprocidad</h3><p>«Podemos revisar un ajuste condicionado a volumen y pago. Una rebaja sin contraprestación no es viable». La relación no se defiende destruyendo el negocio.</p></div>
 <div class="tip">Orden aconsejado: reconocer → preguntar → verificar → encuadrar opciones → intercambiar condiciones.</div>`),
 L('Estudio de caso: no te confundas de problema',`
 <p class="lead">Un buen negociador distingue la <b>posición</b> que escucha de la <b>necesidad</b> que podría estar detrás. Esa separación es provisional: no puedes dar por probado lo que aún no preguntas.</p>
 <div class="scene"><span class="who">Caso trabajado · Ferretería industrial (ficticio)</span><p>Una jefa de compras exige «entrega mañana o cancelación». El vendedor asume que necesita rapidez para toda la orden. Tras preguntar por los hitos de la obra descubre que solo 20% del material es crítico mañana; 80% puede entregarse la próxima semana.</p><p>Su proveedor no dispone del pedido completo, pero sí del 20% urgente. La solución ya no es regalar flete aéreo para todo: es <b>separar volumen por prioridad</b>.</p></div>
 <div class="theory"><h3>Proceso de análisis en cinco movimientos</h3><ol><li><b>Observación:</b> «Dijiste que lo necesitas mañana». Repite sin interpretar intención.</li><li><b>Hipótesis:</b> «Parece que un retraso te dejaría expuesta». Permite corrección.</li><li><b>Pregunta de diagnóstico:</b> «¿Qué porcentaje es imprescindible mañana para no detener la obra?».</li><li><b>Verificación:</b> «Entonces, si despacho hoy las 24 unidades críticas y el resto el martes, ¿se resuelve el riesgo?».</li><li><b>Condición:</b> «Puedo comprometer ese cronograma solo si validamos el stock y se confirma el pedido antes de las 16:00».</li></ol></div>
 <p><b>Contrapunto:</b> escucha activa puede detectar intereses; no garantiza confianza. Si la contraparte tiene incentivos para ocultar información, debes verificar datos. Tampoco le atribuyas estados mentales: «parece que» deja abierta la corrección.</p>
 <div class="tip"><b>Ensayo verbal (5 minutos recomendados):</b> di el mismo mensaje tres veces: en tono defensivo, en tono excesivamente complaciente y en tono tranquilo con límite. Anota cuál sonarías dispuesto a escuchar tú si fueras el comprador.</div>`),
 O('Tu primera intervención escrita','El cliente insiste: «No quiero explicaciones. Quiero un número». Dispones de 4 minutos para escribir una respuesta que podrías decir en voz alta.',[
 'Escribe una etiqueta emocional sin dar por cierto lo que siente.','Haz dos preguntas abiertas para descubrir intereses y alternativas.','Formula un límite comercial respetuoso sin decir todavía un porcentaje de descuento.'
 ],240),
 C('El silencio también negocia',`Después de preguntar «¿Qué cambiaría realmente para que este acuerdo funcione?», el comprador guarda silencio durante seis segundos. ¿Qué haces?`,[
 {text:'Aguantas el silencio sin interrumpir y observas si amplía su respuesta.',pts:20,why:'El silencio permite elaboración y evita regalar información o concesiones.'},
 {text:'Ofreces inmediatamente envío gratis para romper la tensión.',pts:0,why:'Concedes sin recibir información a cambio.'},
 {text:'Dices que si no responde cortarás la reunión.',pts:2,why:'Conviertes una pausa en amenaza innecesaria.'},
 {text:'Repites exactamente la pregunta cuatro veces.',pts:5,why:'Insistir mecánicamente puede sentirse como interrogatorio.'}
 ],'La escucha necesita espacio, no solo preguntas.',75),
 C('Empatía no es sumisión',`Una gerente declara: «Si no haces lo que pido, no te importa nuestra relación». ¿Cuál respuesta mantiene respeto y límites?`,[
 {text:'«Tienes razón. Mantener la relación justifica cualquier esfuerzo».',pts:0,why:'Equiparas respeto con aceptar cualquier condición.'},
 {text:'«No me manipules. Si quieres irte, ándate».',pts:2,why:'Nombras la intención sin evidencia y elevas el conflicto.'},
 {text:'«Veo que para ti esta relación está en juego. Quiero cuidarla, y también necesito que ambas partes podamos sostener el acuerdo».',pts:20,why:'Reconoce el vínculo y preserva el criterio de sostenibilidad.'},
 {text:'«Déjame hablar con mi jefe y te respondo en una semana».',pts:5,why:'Puede comprar tiempo, pero no aborda la preocupación ni define el siguiente paso.'}
 ],'Una conversación puede ser cálida y firme a la vez.',80),
 A('Práctica de terreno: escucha que produce información','Antes de tu próxima sesión, realiza una conversación comercial real o un ensayo con una persona disponible. Utiliza una etiqueta, un silencio deliberado y dos preguntas abiertas. Registra resultados; no inventes una práctica que no hiciste.',[
 'Situación y contraparte (sin nombres ni información confidencial).','¿Qué frase utilizaste y qué respondió la otra persona?','¿Qué información nueva obtuviste y cómo cambió tu posición?'
 ])
 ]},
 {label:'Piensa en juegos',tag:'INCENTIVOS · RECIPROCIDAD · SEÑALES',minutes:80,objective:'Anticipar la respuesta del otro y el valor de futuras rondas.',steps:[
 L('No negocias contra una persona: negocias dentro de un sistema',`
 <p class="lead">La teoría de juegos no te enseña a adivinar pensamientos. Te obliga a identificar jugadores, opciones, información, pagos y consecuencias.</p>
 <div class="theory"><h3>El dilema del prisionero comercial</h3><p>Dos empresas eligen simultáneamente entre <b>cooperar</b> (condiciones estables) y <b>presionar</b> (buscar ventaja individual). La puntuación ficticia por ronda es:</p>
 <div class="table-wrap"><table class="payoff"><tr><th>Proveedor / Comprador</th><th>Comprador coopera</th><th>Comprador presiona</th></tr><tr><th>Proveedor coopera</th><td>8 / 8</td><td>2 / 12</td></tr><tr><th>Proveedor presiona</th><td>12 / 2</td><td>4 / 4</td></tr></table></div>
 <p>Si el otro coopera, presionar te da 12 en vez de 8. Si el otro presiona, te da 4 en vez de 2. Por tanto, <b>presionar domina en una ronda única</b>, aunque ambos obtendrían más cooperando. La solución estable en ese juego único es 4/4.</p></div>
 <div class="warning">Esto es un modelo pedagógico inventado. No representa beneficios ni probabilidades reales de negocios, y no implica coordinar precios con competidores.</div>`),
 C('Diagnóstico matemático: una sola ronda','Ambas partes eligen a la vez y solo se jugará una vez. Con la matriz 8/8, 12/2, 2/12, 4/4, ¿qué estrategia domina para cada parte?',[
 {text:'Cooperar, porque 8 + 8 es mayor que 4 + 4.',pts:4,why:'Eso maximiza el resultado colectivo, no el incentivo individual para cada respuesta rival.'},
 {text:'Presionar, porque siempre entrega más puntos que cooperar dado el movimiento de la otra parte.',pts:20,why:'Es la definición de estrategia estrictamente dominante en esta matriz.'},
 {text:'Depende del nombre de la empresa.',pts:0,why:'La matriz determina los incentivos del juego simplificado.'},
 {text:'Es imposible concluir nada de un juego simultáneo.',pts:3,why:'La teoría de juegos sí permite comparar pagos y mejores respuestas.'}
 ],'Distingue resultado conjunto de equilibrio estratégico.',85),
 {type:'game',title:'Cinco rondas: ¿vas a ganar o a construir una relación?',seconds:35,max:20},
 L('Repetición, reputación y el problema de la última ronda',`
 <div class="theory"><h3>¿Qué acabas de aprender?</h3><p>Cuando las partes esperan volver a negociar, su conducta puede responder al historial. Una estrategia sencilla es <b>reciprocidad</b>: comenzar cooperando y, después, replicar la conducta previa del otro.</p><p>Tu rival del juego utilizó precisamente esa regla. Eso <b>no</b> demuestra que sea la estrategia óptima en cualquier situación.</p><p>Si el juego tiene un final conocido, información perfecta y el mismo dilema en cada ronda, la inducción hacia atrás predice presionar desde el comienzo. La cooperación repetida requiere supuestos adicionales: incertidumbre, reputación fuera del juego, horizonte no conocido u otros incentivos.</p></div>
 <div class="tip">Pregunta comercial clave: «¿Qué ganamos en el siguiente contrato si protegemos este acuerdo?» Y también: «¿Qué pasa si probablemente no hay siguiente contrato?»</div>`),
 L('Estudio de caso: ¿qué es realmente un equilibrio?',`
 <div class="theory"><h3>Equilibrio de Nash ≠ mejor acuerdo</h3><p>Un perfil de estrategias forma un equilibrio de Nash cuando <b>ningún jugador mejora cambiando unilateralmente su decisión</b>, dadas las decisiones de los demás. En la matriz anterior, presionar/presionar da 4/4. Si el otro presiona, cambiar individualmente a cooperar deja solo 2: nadie tiene incentivo a desviarse.</p><p>Pero cooperar/cooperar da 8/8, mejor para ambos. El conflicto entre incentivos individuales y bienestar conjunto es el corazón del dilema.</p></div>
 <div class="scene"><span class="who">Caso trabajado · Proveedor y comprador (ficticio)</span>El comprador puede «fragmentar órdenes» para conseguir descuentos o «agrupar pedidos» para reducir costos logísticos. El proveedor puede «ocultar descuentos» o «compartir una escala transparente de volumen». Si acuerdan umbrales verificables, convierten una discusión de precios en un contrato que recompensa decisiones observables y reduce incertidumbre.</div>
 <div class="theory"><h3>Señales, compromisos y movimientos</h3><ul><li><b>Señal:</b> información que la otra parte observa. Puede ser barata e inverificable («tengo otra oferta») o respaldada por documentos.</li><li><b>Compromiso creíble:</b> conducta difícil de revertir que cambia los incentivos, por ejemplo reservar una capacidad de despacho respaldada por orden de compra.</li><li><b>Juego secuencial:</b> importa quién mueve primero y qué sabrá el segundo al responder.</li><li><b>Información asimétrica:</b> una parte conoce costos, urgencia o alternativas que la otra desconoce. No inventes certezas.</li><li><b>Reputación:</b> afecta el valor futuro de cumplir o incumplir; no sustituye contratos.</li></ul></div>
 <div class="warning">El ejemplo comprador–proveedor busca cooperación vertical legítima. No uses estas ideas para coordinar precios o condiciones entre competidores: podría infringir normas de libre competencia.</div>`),
 C('El error del negociador ingenuo','Un colega afirma: «En cinco rondas siempre conviene cooperar; el futuro garantiza confianza». ¿Qué objeción es más rigurosa?',[
 {text:'No existe teoría que estudie cooperación.',pts:0,why:'Sí existe una teoría extensa de juegos repetidos.'},
 {text:'En un juego finito conocido, la última ronda puede cambiar los incentivos de todas las anteriores.',pts:20,why:'Correcto. No presupongas que la repetición implica cooperación, menos aún con un final comúnmente conocido.'},
 {text:'Cooperar está prohibido en toda negociación comercial.',pts:0,why:'La cooperación puede generar valor y ser racional según el contexto.'},
 {text:'La reputación nunca tiene valor monetario.',pts:2,why:'Puede cambiar resultados futuros y afectar alternativas.'}
 ],'La teoría de juegos depende de sus supuestos.',90),
 O('Mapea un juego real','Piensa en un cliente, proveedor o área interna con la que negocies más de una vez. Separa hechos de supuestos. Dispones de 4 minutos.',[
 '¿Quién decide realmente, quién influye y qué incentivos tiene cada uno?','¿Cuáles son las dos alternativas probables de cada parte?','¿Qué consecuencias inmediatas y futuras produciría presionar versus cooperar?'
 ],240),
 C('Señal creíble versus amenaza vacía','Un comprador amenaza con irse con un proveedor que exige 90 días de anticipo, pero sabes que su obra empieza en 10 días. ¿Cuál es la mejor respuesta inicial?',[
 {text:'«Mientes. Es imposible que te cambies».',pts:0,why:'Tienes una hipótesis, no certeza. Atacar reduce información.'},
 {text:'Concedes el descuento porque una amenaza siempre es creíble.',pts:2,why:'No analizas capacidad ni costo de ejecutar la amenaza.'},
 {text:'Preguntas por las condiciones de implementación de esa alternativa y ofreces opciones verificables de continuidad.',pts:20,why:'Evalúas la credibilidad sin acusaciones y pones opciones sobre la mesa.'},
 {text:'Inventas una amenaza de falta de stock para equilibrar el poder.',pts:0,why:'Una amenaza falsa destruye confianza y puede causar daños.'}
 ],'Una señal es más creíble cuando sostenerla tiene costos o evidencia verificable.',90),
 A('Práctica de terreno: mapa de incentivos','Antes de avanzar, prepara el mapa de una relación comercial real. Puede ser retrospectivo, pero separa lo comprobado de lo que solo sospechas.',[
 'Jugadores reales y su autoridad para decidir.','Qué gana y pierde cada parte en el corto plazo y en la siguiente negociación.','Qué dato verificarías antes de elegir una estrategia.'
 ])
 ]},
 {label:'Defiende el margen',tag:'BATNA · ZOPA · CONCESIONES',minutes:85,objective:'Convertir una discusión de descuentos en un acuerdo económicamente defendible.',steps:[
 L('Tu poder real está fuera de la mesa',`
 <p class="lead">Una mala alternativa hace tentadora cualquier oferta. Una buena alternativa permite decir que no sin convertirlo en una pelea.</p>
 <div class="theory"><h3>Tres números / conceptos que separan al profesional del improvisador</h3><ol><li><b>BATNA</b>: mejor alternativa realista si no hay acuerdo (ej.: vender la capacidad a otra obra). No es una amenaza ni un deseo.</li><li><b>Valor de reserva</b>: peor acuerdo que todavía prefieres a tu BATNA, considerando todos los términos.</li><li><b>ZOPA</b>: rango de acuerdos aceptables para ambas partes, cuando sus valores de reserva son compatibles.</li></ol><p>Primero fortalece y cuantifica tus alternativas; después define tu límite. Nunca confundas <b>margen sobre ventas</b> con recargo sobre costos.</p></div>
 <div class="scene"><span class="who">Caso industrial · Revestimientos</span>Precio de lista por unidad: $50.000. Costo directo: $36.000. Venta potencial: 120 unidades. Margen bruto de lista: 28%. El comprador exige 15% de descuento; tu política exige al menos 22% de margen después de costos relevantes.</div>
 <p>La pregunta ya no es «¿puedo darle 15%?». Es «¿qué combinación de precio, plazo, entrega y volumen queda por encima de mi valor de reserva y satisface al comprador?».</p>`),
 C('Primera trampa: descuento no es margen','Precio $50.000, costo directo $36.000. Si descuentas 15% del precio de lista, ¿cuál es el margen bruto sobre venta, antes de otros costos?',[
 {text:'13,0%',pts:4,why:'Confunde pérdida porcentual de margen con margen resultante.'},
 {text:'15,3% aproximadamente',pts:20,why:'Precio $42.500; margen ($42.500 - $36.000) / $42.500 = 15,29%.'},
 {text:'28% menos 15% = 13%',pts:0,why:'Los márgenes no se restan directamente de esa forma.'},
 {text:'33,3%',pts:0,why:'No corresponde a la base del precio descontado.'}
 ],'Si la rebaja cae sobre el precio, el margen se contrae de forma no lineal.',90),
 L('El crédito también es un descuento',`
 <div class="theory"><h3>Supuesto de entrenamiento (no financiero universal)</h3><p>Para esta simulación usamos un costo de financiamiento simple de <b>1,3% mensual sobre el costo directo</b>. A 30 días equivale a $468 por unidad; a 60 días, a $936. No incluye riesgo de incobrabilidad ni impuestos.</p><p>Con pago a 30 días, un costo de $36.000 y margen mínimo de 22%, necesitas un precio de al menos <b>$46.754</b> aproximadamente. A 60 días necesitas al menos $47.354.</p><p>Supongamos que el comprador puede aceptar <b>hasta $47.000 a 30 días</b> o <b>hasta $46.500 al contado</b>, y no acepta sobre ese techo. Así aparece una ZOPA estrecha: si cobras 30 días, aprox. $46.754–$47.000.</p></div>
 <div class="warning">No existe una ZOPA conocida de antemano en la vida real: el precio de reserva del comprador puede ser desconocido, estratégico o multidimensional. Aquí se revela para enseñar el cálculo.</div>`),
 L('Estudio de caso: una ZOPA que cambia de forma',`
 <p class="lead">La zona de posible acuerdo rara vez es un número fijo. Cambia cuando modificas la composición del trato.</p>
 <div class="theory"><h3>Tres condiciones, tres resultados distintos</h3><ol><li><b>Pago al contado.</b> Costo $36.000, margen mínimo 22%: precio mínimo $36.000 / 0,78 = $46.154. Techo del comprador $46.500. Hay ZOPA aproximada de $346 por unidad.</li><li><b>Pago a 30 días.</b> Costo imputado $36.468; precio mínimo $46.754. Techo del comprador $47.000. ZOPA aproximada de $246.</li><li><b>Pago a 60 días.</b> Costo imputado $36.936; precio mínimo $47.354. Techo del comprador $47.000. <b>No hay ZOPA</b> con estas hipótesis y sin otras variables.</li></ol></div>
 <div class="scene"><span class="who">Pregunta de estudio</span>¿Qué haces si no hay ZOPA? No siempre conviene insistir. Puedes cambiar volumen, producto, cronograma, garantías o modalidad de pago, buscar un nuevo proveedor o retirarte de la mesa.</div>
 <p><b>Sobre anclajes:</b> el primer número puede influir en la negociación, pero no reemplaza la investigación. Un ancla desinformada puede ser inferior a tu propio valor de reserva o tan absurda que impida un acuerdo.</p>
 <p><b>Sobre BATNA:</b> tener una cotización alternativa no significa que sea ejecutable. Considera plazo, calidad, capacidad y costos de cambiar. La amenaza «me voy con otro» solo importa estratégicamente si salir es realmente posible.</p>
 <div class="tip"><b>Mini tarea:</b> antes de usar la calculadora, calcula en una hoja por qué un 6% de descuento a 30 días da $47.000 de precio y cerca de 22,4% de margen bajo estos supuestos.</div>`),
 {type:'calculator',title:'La mesa de concesiones: consigue un acuerdo viable',seconds:240,max:25},
 C('Conceder sin regalar','El comprador pide 8% de rebaja y 60 días. ¿Qué enfoque protege mejor el valor del acuerdo?',[
 {text:'Conceder ambos puntos para cerrar antes que la competencia.',pts:0,why:'No valoras la suma de concesiones ni el costo del crédito.'},
 {text:'Cambiar simultáneamente precio y crédito sin mencionar condiciones.',pts:5,why:'No se percibe ni controla la reciprocidad.'},
 {text:'Ofrecer alternativas condicionadas: descuento menor a cambio de volumen firme, menor plazo o logística más eficiente.',pts:20,why:'Convierte precio y crédito en variables negociables y busca intercambios de valor.'},
 {text:'Rechazar cualquier conversación sobre condiciones.',pts:4,why:'Un límite es necesario, pero rechazar diseñar alternativas puede destruir acuerdos viables.'}
 ],'Una concesión debería comprar algo concreto y verificable.',85),
 O('Prepara tu oferta de tres paquetes','Imagina que debes presentar tres alternativas que sean defendibles. Tu comprador valorará rapidez, plazo y monto total. Tienes 5 minutos.',[
 'Paquete A: precio, plazo, cantidad y motivo económico.','Paquete B: cambia una variable y exige una contraprestación.','¿Cuál es tu BATNA verificable y en qué punto prefieres retirarte?'
 ],300),
 C('¿Quién debería ofrecer primero?','Conoces bien los costos, pero tienes dudas importantes sobre presupuesto y urgencia de la contraparte. ¿Qué decisión es más rigurosa?',[
 {text:'Anclar siempre primero y muy alto; nunca hay riesgos.',pts:4,why:'Los anclajes también pueden alejar del rango viable y revelar ignorancia.'},
 {text:'Primero investigo el rango, las alternativas y los criterios del comprador; luego decido si me conviene anclar.',pts:20,why:'La conveniencia de la primera oferta depende del conocimiento y la situación.'},
 {text:'Dejo que el comprador decida todo y solo acepto.',pts:0,why:'Entregas la iniciativa.'},
 {text:'Informo el costo de producción y acepto su margen deseado.',pts:0,why:'Revelas información sensible sin necesidad y omites tu BATNA.'}
 ],'La preparación pesa más que la bravata.',90),
 A('Práctica de terreno: ficha de preparación','Toma una negociación comercial real o ya ocurrida. Construye su ficha con números aproximados verificables, sin revelar información sensible.',[
 'Mi alternativa sin acuerdo (BATNA) y evidencia de que existe.','Mi límite de aceptación y cómo lo calculé.','Tres variables intercambiables además del precio y condiciones que pediría.'
 ])
 ]},
 {label:'Mesa final',tag:'CRISIS SIMULADA · DECISIÓN · DEBRIEF',minutes:90,objective:'Integrar emoción, estrategia, cálculo y ética bajo presión.',steps:[
 L('Briefing: Operación Horizonte',`
 <p class="lead">Ya tienes herramientas. Ahora enfrentarás cinco movimientos consecutivos. Cada decisión revela un costo y una consecuencia.</p>
 <div class="scene"><span class="who">Dossier confidencial para el negociador</span><p>Tu empresa ficticia, <b>Suministros Cumbre</b>, vende materiales de obra a Constructora Horizonte.</p><p>Factura potencial: <b>$12.000.000</b>. Costo directo y logístico estimado: <b>$8.760.000</b>. Margen inicial: <b>27%</b>. Política: no bajar del <b>22%</b> sin autorización formal.</p><p>Cliente histórico: representa 8% de tus ventas. Hay un competidor que dice ofrecer 11% menos, pero no has verificado equivalencia de servicio. El comprador exige respuesta urgente; tu proveedor advierte riesgos de abastecimiento parcial.</p></div>
 <div class="theory"><h3>Reglas de esta misión</h3><ul><li>5 decisiones, cada una con reloj propio de 90–120 segundos.</li><li>No puedes volver atrás para cambiar una decisión registrada.</li><li>20 puntos por decisión estratégica excelente; puntaje parcial por alternativas razonables.</li><li>Una decisión vencida se registra en 0. Puedes repetir el módulo completo para aprender.</li><li>La simulación no tiene una contraparte con IA: sigue escenarios y criterios diseñados de antemano.</li></ul></div>`),
 C('Fase 1 / La amenaza','Comprador: «Tienes cinco minutos. Si no igualas al otro, terminamos la relación». Tu jefe no responde el teléfono. ¿Tu primera acción?',[
 {text:'Pido la cotización alternativa, identifico si incluye el mismo alcance y reconozco la urgencia sin conceder.',pts:20,why:'Recuperas datos y capacidad de encuadre sin perder la relación.'},
 {text:'Acepto el 11% inmediatamente para evitar el conflicto.',pts:0,why:'Con 11% de descuento el margen baja a ~18%, inferior al límite antes de nuevos costos.'},
 {text:'Amenazo con cancelar todas las entregas futuras.',pts:2,why:'Una represalia puede destruir valor y no resuelve la comparación.'},
 {text:'Digo que consultaré con mi jefe, sin especificar cuándo ni qué información requiero.',pts:7,why:'Buscas autoridad, pero no recuperas información ni gestionas la urgencia.'}
 ],'Primero separa presión de evidencia.',100),
 C('Fase 2 / El interés oculto','Descubres que el verdadero problema no es solo precio: si falla la entrega, el comprador enfrenta una multa contractual. ¿Qué haces?',[
 {text:'Mantengo exclusivamente el precio como tema central.',pts:2,why:'Ignoras una fuente decisiva de valor: continuidad del abastecimiento.'},
 {text:'Prometo entrega total aunque mi proveedor no la ha confirmado.',pts:0,why:'Una promesa no verificable puede producir daños económicos y reputacionales.'},
 {text:'Investigo el cronograma crítico y ofrezco un plan verificable de entregas parciales condicionado a validación de stock.',pts:20,why:'Resuelves el problema real, sin prometer lo que no controlas.'},
 {text:'Le sugiero resolver directamente con tu proveedor sin involucrarte.',pts:3,why:'Abandonas el rol de integrador y pierdes oportunidad de crear valor.'}
 ],'Los intereses reales pueden ser distintos de las posiciones declaradas.',100),
 C('Fase 3 / La competencia','El comprador muestra una captura de un precio 11% inferior. La propuesta alternativa exige anticipo de 70% y despacho 15 días después. La obra necesita material en 5 días.',[
 {text:'Rechazo la captura como falsa sin verificar nada.',pts:2,why:'Una acusación no aporta prueba y puede escalar el conflicto.'},
 {text:'Igualo todo el precio y mantengo nuestros mejores plazos.',pts:0,why:'Trasladas todo el costo de la diferencia al margen propio.'},
 {text:'Comparo costo total, riesgo de atraso, anticipo y disponibilidad, y estructuro dos paquetes equivalentes.',pts:20,why:'Mueves la conversación de precio unitario a valor total verificable.'},
 {text:'Digo que todas las cotizaciones por internet son engañosas.',pts:3,why:'Generalizas sin evidencia.'}
 ],'BATNA ajeno ≠ amenaza verbal; la alternativa debe ser ejecutable.',100),
 C('Fase 4 / El quiebre de suministro','Tu proveedor confirma que solo puede despachar 70% del volumen en cinco días; el resto demoraría 12 días. ¿Cuál decisión es defendible?',[
 {text:'Oculto el faltante y recibo la orden de compra completa.',pts:0,why:'Es engañoso y deja a la contraparte sin capacidad de gestionar el riesgo.'},
 {text:'Comunico el riesgo, busco respaldo alternativo y negocio hitos de entrega por escrito antes de comprometerme.',pts:20,why:'Transparencia, mitigación y compromisos creíbles.'},
 {text:'Cancelo el trato sin explorar opciones.',pts:7,why:'Proteges el incumplimiento, pero no exploras alternativas de valor.'},
 {text:'Garantizo con mi patrimonio que todo llegará.',pts:0,why:'Aumentas riesgo con una promesa sin control.'}
 ],'La confianza se construye con compromisos verificables, no con teatralidad.',100),
 C('Fase 5 / La última concesión','El comprador acepta el plan de entregas, pero pide un descuento adicional del 6% y crédito a 60 días. Tu margen inicial era 27% antes de estas concesiones. ¿Cómo cierras?',[
 {text:'Concedo ambas variables porque ya hicimos tanto trabajo.',pts:0,why:'Caes en sesgo de costo hundido. El acuerdo no se vuelve rentable por el tiempo invertido.'},
 {text:'Presento paquetes con precio/plazo/volumen, calculo margen y costo financiero, fijo aprobación cuando corresponda y acepto retirarme si no cumple el mínimo.',pts:20,why:'Integras BATNA, ZOPA, reciprocidad y control de márgenes.'},
 {text:'Exijo firma inmediata a precio de lista sin explicaciones.',pts:6,why:'Proteges precio, pero probablemente desperdicias opciones negociables.'},
 {text:'Invento una oferta de otro cliente para presionarlo.',pts:0,why:'Una señal falsa es una mala apuesta estratégica y ética.'}
 ],'El cierre correcto no es cualquier cierre. Debe ser ejecutable, rentable y defendible.',120),
 L('Post-mortem: el costo de las decisiones impulsivas',`
 <p class="lead">Antes de escribir tu diagnóstico final, revisa los números del contrato Horizonte. La presión psicológica importa, pero el margen no negocia con las emociones.</p>
 <div class="theory"><h3>Radiografía económica del caso</h3><ul><li>Precio: <b>$12.000.000</b>; costo: <b>$8.760.000</b>; margen inicial <b>27%</b>.</li><li>Rebaja de <b>11%</b>: el precio cae a <b>$10.680.000</b>, el margen bruto queda en <b>18,0%</b> aprox. Reprueba el umbral de 22%.</li><li>Rebaja de <b>6%</b>: precio <b>$11.280.000</b>, margen bruto antes de crédito <b>22,3%</b> aprox. Parece viable por muy poco.</li><li>Pero si esos 60 días costaran <b>1,3% mensual simple sobre el costo</b>, el costo financiero sería <b>$227.760</b> y el margen después de ese costo bajaría a <b>20,3%</b>. Los demás riesgos podrían reducirlo más.</li></ul></div>
 <div class="scene"><span class="who">La lección incómoda</span>El cliente puede tener razón en su urgencia y aun así pedirte algo económicamente inviable. No lo conviertas en enemigo; presenta la matemática, diseña opciones y conserva una salida digna.</div>
 <p><b>Chequeo ético:</b> no hagas promesas de despacho sin verificar stock, no inventes competidores, no uses una «etiqueta emocional» para fingir comprender y no amenaces con aquello que no piensas cumplir.</p>
 <div class="tip">Una negociación bien cerrada no es necesariamente un contrato firmado: a veces es una decisión documentada de no destruir valor.</div>`),
 O('Debrief del negociador: escribe lo que aprendiste','Tienes cinco minutos para sintetizar tu criterio sin frases vacías. Tus textos no serán calificados semánticamente por el programa.',[
 '¿Cuál fue tu sesgo o reacción más peligrosa durante estas cuatro misiones?','Redacta tu protocolo personal de 5 pasos antes de negociar un contrato.','¿En qué situación deberías retirarte de la mesa aunque el cliente sea importante?'
 ],300),
 L('Tu doctrina personal de negociación',`

 record(m,s,{type:'calculator',answer:c,pts,max:25,feedback});}
function moduleEnd(m){const p=moduleProgress(m),approved=p.pct>=70,allFinished=modules.every((x,i)=>moduleProgress(i).complete&&moduleProgress(i).pct>=70);
 return `<div class="module-end"><div class="eyebrow">RESULTADOS · MISIÓN 0${m+1}</div><div class="completion-icon">${approved?'◇':'↺'}</div><h1>${approved?'Mesa superada.':'Esta mesa aún te gana.'}</h1><div class="score-big">${p.pct}%</div><p class="lead">${p.score} de ${p.max} puntos. ${approved?'Apruebas esta misión. Tu siguiente desafío está desbloqueado.':'El criterio de aprobación es 70%. Para intentarlo de nuevo, se reinicia esta misión y sus respuestas; tus bitácoras anteriores se conservan en el historial del navegador.'}</p><div class="actions"><button class="btn primary" onclick="${approved?(m===3?'goHome()':'goModule('+(m+1)+')'):'retryModule('+m+')'}">${approved?(m===3?'Ver tablero final':'Ir a la misión '+(m+2)):'Repetir misión ↺'}</button><button class="btn ghost" onclick="downloadReport()">↓ Descargar resultados</button><button class="btn ghost" onclick="goHome()">Tablero</button>${approved?`<button class="btn danger" onclick="retryModule(${m})">Repetir para mejorar</button>`:''}</div></div>
 ${allFinished?`<div class="report"><div class="eyebrow">TRAVESÍA COMPLETA</div><h2>Ahora comienza el aprendizaje real.</h2><p>Has aprobado las cuatro simulaciones. Esto es una <b>constancia de práctica personal</b>, no una certificación académica. El paso siguiente es revisar tus respuestas, contrastarlas con casos de terreno y volver a negociar condiciones reales.</p><div class="actions"><button class="btn primary" onclick="downloadReport()">Descargar bitácora completa</button><button class="btn" onclick="window.print()">Imprimir esta constancia</button></div></div>`:''}
 <div class="report"><h3>Desglose de decisiones</h3><div class="result-list">${modules[m].steps.filter(x=>x.max>0).map((st)=>{const i=modules[m].steps.indexOf(st),r=S.records[key(m,i)];return `<div class="result-row"><span>${esc(st.title)}</span><strong>${r?.pts||0}/${st.max}</strong></div>`}).join('')}</div></div>
 ${sourcesHTML()}`}
function retryModule(m){if(!confirm('¿Reiniciar la misión '+(m+1)+'? El historial exportable conservará un resumen del intento, pero las respuestas activas de esta misión se reemplazarán; el trabajo de las demás se conservará.'))return;const previous=moduleProgress(m);S.history.push({module:m+1,date:Date.now(),score:previous.score,max:previous.max,pct:previous.pct});modules[m].steps.forEach((st,i)=>{delete S.records[key(m,i)];delete S.deadlines[key(m,i)];delete S.drafts[key(m,i)]});if(m===1)S.game={rounds:[],deadline:null};S.cursor={m,s:0};save();render();scrollTo(0,0)}
function resetAll(){if(!confirm('¿Borrar definitivamente el progreso local de este navegador? Exporta primero tu bitácora.'))return;localStorage.removeItem(STORE);S=structuredClone(DEFAULT);render();scrollTo(0,0)}
function sourcesHTML(){return `<div class="report"><h3>Fuentes para profundizar</h3><ol class="source-list"><li><a href="https://leb.fbi.gov/articles/featured-articles/fifty-years-of-fbi-crisis-hostage-negotiation" target="_blank" rel="noreferrer">FBI Law Enforcement Bulletin · 50 años de negociación de crisis (2024)</a>. Historia de escucha e influencia conductual.</li><li><a href="https://leb.fbi.gov/articles/focus/focus-on-training-an-evaluation-tool-for-crisis-negotiators" target="_blank" rel="noreferrer">FBI · evaluación de escucha activa (2015)</a>. Habilidades observables, no trucos.</li><li><a href="https://plato.stanford.edu/entries/game-theory/" target="_blank" rel="noreferrer">Stanford Encyclopedia of Philosophy · Game Theory</a>. Equilibrios y juegos repetidos.</li><li><a href="https://www.pon.harvard.edu/daily/negotiation-skills-daily/negotiation-preparation-checklist/" target="_blank" rel="noreferrer">Harvard Program on Negotiation · lista de preparación</a>. BATNA, reservas y preparación.</li><li><a href="https://www.pon.harvard.edu/daily/dealmaking-daily/what-is-distributive-negotiation-strategies/" target="_blank" rel="noreferrer">Harvard Program on Negotiation · negociación distributiva</a>. Reparto y creación de valor.</li></ol><p class="mini">Los casos, cifras, rúbricas y la mnemotecnia PRESIÓN son elaboraciones pedagógicas originales para este laboratorio; no son ejemplos oficiales de las instituciones citadas.</p></div>`}
function reportText(){const out=[];out.push('MESA CERO · BITÁCORA DE ESTUDIO PERSONAL','Fecha de exportación: '+new Date().toLocaleString('es-CL'),'Creación: '+new Date(S.created).toLocaleString('es-CL'),'---','EVALUACIÓN: puntajes de alternativas y realización; el texto abierto NO fue analizado con IA.','');
 modules.forEach((m,i)=>{const p=moduleProgress(i);out.push('==== MISIÓN '+(i+1)+' · '+m.label+' ====',`Puntuación: ${p.score}/${p.max} (${p.pct}%) · ${p.complete?'completa':'incompleta'}`);m.steps.forEach((st,j)=>{const r=S.records[key(i,j)],d=S.drafts[key(i,j)];if(!r&&!d)return;out.push('','ETAPA '+(j+1)+': '+st.title,`Estado: ${r?'Cerrada':'Borrador'} · Puntos: ${r?.pts??'-'}/${st.max}`);if(st.type==='choice'){if(r?.answer!=null)out.push('Decisión: '+st.options[r.answer].text,'Retroalimentación: '+r.feedback)}else if(st.type==='game'){(r?.answer||S.game.rounds).forEach((x,z)=>out.push(`Ronda ${z+1}: Tú ${x.me}, rival ${x.bot}; puntos ${x.mePoints}/${x.botPoints}`))}else if(st.type==='calculator'){const a=r?.answer||d;if(a)out.push(`Descuento ${a.discount}%; plazo ${a.days} días; flete ${a.freight?'incluido':'no incluido'}; precio ${a.price??'?'}; margen ${a.margin??'?'}%`)}else if(st.type==='open'||st.type==='assignment'){const a=r?.answer||d||{};st.fields.forEach((q,z)=>out.push(q+'\n'+String(a[z]||'')));if(st.type==='assignment')out.push('Práctica real declarada: '+(r?.actual?'Sí':'No'))}});out.push('')});if(S.history.length)out.push('HISTORIAL DE REPETICIONES',...S.history.map(x=>`Misión ${x.module}: ${x.score}/${x.max} (${x.pct}%) · ${fmtDate(x.date)}`));out.push('','FUENTES','https://leb.fbi.gov/articles/featured-articles/fifty-years-of-fbi-crisis-hostage-negotiation','https://plato.stanford.edu/entries/game-theory/','https://www.pon.harvard.edu/daily/negotiation-skills-daily/negotiation-preparation-checklist/');return out.join('\n')}
function downloadReport(){const content=reportText(),blob=new Blob([content],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MESA_CERO_Bitacora_'+new Date().toISOString().slice(0,10)+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
// Cuando se vuelve del tablero con un desafío abierto, el temporizador continúa.
render();
</script>
</body>
</html>
